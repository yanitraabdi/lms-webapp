# E2E stack: run ONLY as `docker compose -p inverta-e2e -f docker-compose.yml -f docker-compose.e2e.yml ...`
# Own project name, ports and volume, so it never touches the deployed `academy` stack.
services:
  postgres:
    ports: !override
      - "5532:5432"
  api:
    environment:
      Email__Provider: "dev"            # belt and braces: e2e never sends real email
      RateLimits__PermitLimit: "1000"   # every browser call reaches the API from the proxy's one IP
      DevAdmin__Email: "e2e-admin@test.local"
      DevAdmin__Password: "E2e-Admin-Only-1!"
      Cors__AllowedOrigins__0: "http://localhost:3100"
    ports: !override
      - "8180:8080"
  frontend:
    ports: !override
      - "3100:3000"
